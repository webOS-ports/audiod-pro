     SPDX-License-Identifier: Apache-2.0

     audiod (user audio) is oFono's hands-free audio agent: it registers
     with org.ofono.HandsfreeAudioManager and asks a headset's
     org.ofono.HandsfreeAudioCard for its SCO link. oFono's own ofono.conf
     lets only root and the console talk to org.ofono, and denies everyone
     else. oFono calling back into the agent (NewConnection, Release) is
     already allowed there for root. -->

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="audio">
    <allow send_destination="org.ofono" send_interface="org.ofono.HandsfreeAudioManager"/>
    <allow send_destination="org.ofono" send_interface="org.ofono.HandsfreeAudioCard"/>
  </policy>
</busconfig>
